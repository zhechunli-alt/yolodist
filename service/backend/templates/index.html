<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLODist 工业缺陷质检系统</title>
    <style>
      :root {
        --bg: #f4faf7;
        --card: #ffffff;
        --line: #d8e4dd;
        --text: #1f2937;
        --muted: #6b7280;
        --brand: #0f766e;
        --brand2: #0284c7;
        --ok: #16a34a;
        --bad: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--text);
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at 90% 0%, #d8f0ff 0%, transparent 40%), var(--bg);
      }
      .app {
        max-width: 1260px;
        margin: 0 auto;
        padding: 16px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .topbar h1 {
        margin: 0;
        font-size: 24px;
      }
      .status {
        color: var(--muted);
        font-size: 13px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
        background: var(--bad);
      }
      .dot.ok { background: var(--ok); }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 12px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      .panel-title {
        margin: 0 0 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 8px 10px;
        cursor: pointer;
      }
      .btn.primary {
        border: 0;
        color: #fff;
        background: linear-gradient(90deg, var(--brand), var(--brand2));
      }
      .btn.active {
        border: 0;
        color: #fff;
        background: linear-gradient(90deg, var(--brand), var(--brand2));
      }
      .btn[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      input, textarea, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 14px;
      }
      textarea { min-height: 90px; resize: vertical; }

      .file-list {
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        max-height: 260px;
        overflow: auto;
      }
      .file-list li {
        padding: 8px 10px;
        border-bottom: 1px solid #edf2ef;
        font-size: 12px;
        cursor: pointer;
      }
      .file-list li:last-child { border-bottom: 0; }
      .file-list li.active {
        background: #ecfdf5;
        color: #065f46;
        font-weight: 600;
      }

      .model-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .main-grid {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 12px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tab-content { display: none; }
      .tab-content.active { display: block; }

      .viewer-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .viewer-box {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }
      .viewer-title {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .canvas-wrap {
        border: 1px dashed var(--line);
        border-radius: 8px;
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
      }
      canvas, img.preview {
        max-width: 100%;
        max-height: 280px;
      }

      .result-kv {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .det-list {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        max-height: 180px;
        overflow: auto;
      }
      .det-list li {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .compare-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .compare-item {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        font-size: 12px;
      }
      pre {
        margin: 0;
        padding: 10px;
        border-radius: 10px;
        background: #0b1f33;
        color: #d9f0ff;
        font-size: 12px;
        max-height: 180px;
        overflow: auto;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 980px) {
        .layout { grid-template-columns: 1fr; }
        .meta-grid { grid-template-columns: 1fr; }
        .viewer-grid, .compare-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>工业缺陷检测与质检记录系统</h1>
        <div class="status">
          <span id="healthDot" class="dot"></span>
          <span id="healthText">连接中...</span>
          <span> | 当前模型：<strong id="currentModel">-</strong></span>
        </div>
      </div>

      <div class="layout">
        <aside class="col">
          <section class="panel">
            <h3 class="panel-title">图像加载模块</h3>
            <div class="col">
              <input id="singleFileInput" type="file" accept="image/*" />
              <input id="folderInput" type="file" accept="image/*" webkitdirectory multiple />
              <div class="row">
                <button class="btn" onclick="loadFolderFiles()">加载文件夹</button>
                <button class="btn" onclick="clearFiles()">清空列表</button>
              </div>
              <ul id="fileList" class="file-list"></ul>
            </div>
          </section>

          <section class="panel">
            <h3 class="panel-title">模型切换</h3>
            <div id="modelButtons" class="model-buttons"></div>
          </section>
        </aside>

        <main class="main-grid">
          <section class="panel">
            <h3 class="panel-title">样本信息模块</h3>
            <div class="meta-grid">
              <input id="metaSampleName" placeholder="样本名称" />
              <input id="metaBatchNo" placeholder="批次号" />
              <input id="metaStation" placeholder="工位/产线" />
              <input id="metaImagePath" placeholder="图片路径（自动填充）" />
              <input id="metaImageSize" placeholder="分辨率（自动填充）" />
              <input id="metaSource" placeholder="来源" />
            </div>
            <div class="row" style="margin-top:8px;">
              <button class="btn" onclick="saveSampleMetaOnly()">保存样本信息</button>
            </div>
          </section>

          <section class="panel">
            <div class="tabs">
              <button id="tabBtnDetect" class="btn active" onclick="showTab('detect')">缺陷检测</button>
              <button id="tabBtnCompare" class="btn" onclick="showTab('compare')">多模型对比</button>
              <button id="tabBtnStats" class="btn" onclick="showTab('stats')">统计评估</button>
            </div>

            <div id="tabDetect" class="tab-content active">
              <div class="row" style="margin-bottom:8px;">
                <input id="confInput" type="number" step="0.01" min="0" max="1" placeholder="置信度阈值(可选)" />
                <button class="btn primary" onclick="runDetect()">分割/检测</button>
              </div>
              <div class="viewer-grid">
                <div class="viewer-box">
                  <p class="viewer-title">原图</p>
                  <div class="canvas-wrap"><img id="previewImage" class="preview" alt="原图预览" /></div>
                </div>
                <div class="viewer-box">
                  <p class="viewer-title">检测结果</p>
                  <div class="canvas-wrap"><canvas id="overlayCanvas"></canvas></div>
                </div>
              </div>
            </div>

            <div id="tabCompare" class="tab-content">
              <div class="row" style="margin-bottom:8px;">
                <button class="btn primary" onclick="runCompare()">查看全模型检测结果</button>
              </div>
              <div id="compareGrid" class="compare-grid"></div>
            </div>

            <div id="tabStats" class="tab-content">
              <div class="result-kv">
                <span>模型：<strong id="statModel">-</strong></span>
                <span>耗时(ms)：<strong id="statLatency">-</strong></span>
                <span>目标数：<strong id="statCount">0</strong></span>
                <span>最高置信度：<strong id="statMaxConf">-</strong></span>
                <span>平均置信度：<strong id="statAvgConf">-</strong></span>
              </div>
              <ul id="detList" class="det-list"></ul>
            </div>
          </section>

          <section class="panel">
            <h3 class="panel-title">人工复核模块</h3>
            <div class="row">
              <input id="doctorName" placeholder="复核人" />
              <select id="riskLevel">
                <option value="">缺陷等级</option>
                <option value="low">轻微</option>
                <option value="medium">中等</option>
                <option value="high">严重</option>
              </select>
            </div>
            <div style="margin-top:8px;">
              <textarea id="doctorDiagnosis" placeholder="填写人工复核意见..."></textarea>
            </div>
            <div class="row" style="margin-top:8px;">
              <button class="btn primary" onclick="saveDiagnosisRecord()">保存复核</button>
              <button class="btn" onclick="loadRecordList()">刷新历史</button>
            </div>
            <div style="margin-top:8px;">
              <select id="recordSelect"></select>
            </div>
            <div class="row" style="margin-top:8px;">
              <button class="btn" onclick="exportSelectedReport()">导出质检报告(JSON)</button>
            </div>
          </section>

          <section class="panel footer">
          <span class="small" id="saveStatus">尚未保存复核记录</span>
            <span class="small">原始返回</span>
          </section>

          <section class="panel">
            <pre id="rawOutput">{ "message": "等待操作..." }</pre>
          </section>
        </main>
      </div>
    </div>

    <script>
      const state = {
        files: [],
        selectedFile: null,
        currentModel: null,
        lastResult: null,
        compareResults: [],
      };

      function setRaw(obj) {
        document.getElementById("rawOutput").textContent = JSON.stringify(obj, null, 2);
      }
      function setStatus(ok) {
        const dot = document.getElementById("healthDot");
        const text = document.getElementById("healthText");
        dot.className = ok ? "dot ok" : "dot";
        text.textContent = ok ? "服务正常" : "服务异常";
      }
      function showTab(name) {
        const pairs = [
          ["detect", "tabBtnDetect", "tabDetect"],
          ["compare", "tabBtnCompare", "tabCompare"],
          ["stats", "tabBtnStats", "tabStats"],
        ];
        pairs.forEach(([tab, btnId, panelId]) => {
          const active = tab === name;
          document.getElementById(btnId).className = "btn" + (active ? " active" : "");
          document.getElementById(panelId).className = "tab-content" + (active ? " active" : "");
        });
      }
      function confValue() {
        const raw = document.getElementById("confInput").value.trim();
        return raw ? Number(raw) : null;
      }
      async function apiJson(url, options = {}) {
        const res = await fetch(url, options);
        let data = {};
        try { data = await res.json(); } catch {}
        return { ok: res.ok, status: res.status, data };
      }

      async function refreshHealthAndModels() {
        const h = await apiJson("/api/v1/health");
        setStatus(h.ok && h.data.status === "ok");
        state.currentModel = h.data.current_model || null;
        document.getElementById("currentModel").textContent = state.currentModel || "未选择";

        const m = await apiJson("/api/v1/models");
        if (!m.ok) {
          setRaw(m.data || m);
          return;
        }
        const box = document.getElementById("modelButtons");
        box.innerHTML = "";
        (m.data.models || []).forEach((x) => {
          const b = document.createElement("button");
          b.className = "btn" + (x.name === state.currentModel ? " active" : "");
          b.textContent = x.available ? x.name : `${x.name} (缺失)`;
          b.disabled = !x.available;
          b.onclick = () => switchModel(x.name);
          box.appendChild(b);
        });
      }

      async function switchModel(name) {
        const r = await apiJson("/api/v1/models/switch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model_name: name }),
        });
        setRaw(r.data);
        if (r.ok) {
          state.currentModel = r.data.current_model;
          document.getElementById("currentModel").textContent = state.currentModel;
          refreshHealthAndModels();
        }
      }

      function clearFiles() {
        state.files = [];
        state.selectedFile = null;
        document.getElementById("fileList").innerHTML = "";
        document.getElementById("previewImage").removeAttribute("src");
      }
      function renderFileList() {
        const ul = document.getElementById("fileList");
        ul.innerHTML = "";
        state.files.forEach((f, idx) => {
          const li = document.createElement("li");
          li.textContent = f.webkitRelativePath || f.name;
          if (state.selectedFile === f) li.className = "active";
          li.onclick = () => selectFileByIndex(idx);
          ul.appendChild(li);
        });
      }
      function selectFileByIndex(idx) {
        state.selectedFile = state.files[idx] || null;
        renderFileList();
        if (state.selectedFile) {
          updatePreview(state.selectedFile);
          fillMetaFromFile(state.selectedFile);
        }
      }
      function loadFolderFiles() {
        const files = Array.from(document.getElementById("folderInput").files || []);
        state.files = files.filter((f) => f.type.startsWith("image/"));
        if (state.files.length > 0) state.selectedFile = state.files[0];
        renderFileList();
        if (state.selectedFile) {
          updatePreview(state.selectedFile);
          fillMetaFromFile(state.selectedFile);
        }
      }
      function fillMetaFromFile(file) {
        document.getElementById("metaSampleName").value = file.name;
        document.getElementById("metaImagePath").value = file.webkitRelativePath || file.name;
        document.getElementById("metaSource").value = file.webkitRelativePath ? "folder_upload" : "single_upload";
      }
      function updatePreview(file) {
        const img = document.getElementById("previewImage");
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          document.getElementById("metaImageSize").value = `${img.naturalWidth}x${img.naturalHeight}`;
          drawOverlay([], img);
        };
      }
      function drawOverlay(detections, sourceImg) {
        const canvas = document.getElementById("overlayCanvas");
        const ctx = canvas.getContext("2d");
        const w = sourceImg ? sourceImg.naturalWidth : 1;
        const h = sourceImg ? sourceImg.naturalHeight : 1;
        canvas.width = Math.max(1, w);
        canvas.height = Math.max(1, h);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (sourceImg) ctx.drawImage(sourceImg, 0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#ef4444";
        ctx.fillStyle = "#ef4444";
        ctx.lineWidth = 2;
        ctx.font = "14px sans-serif";
        (detections || []).forEach((d) => {
          const [x1, y1, x2, y2] = d.xyxy || [0, 0, 0, 0];
          ctx.strokeRect(x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
          const label = `${d.class_name || d.cls}:${d.conf}`;
          ctx.fillText(label, x1 + 2, Math.max(14, y1 - 4));
        });
      }

      function statFromResult(r) {
        const ds = r.detections || [];
        const confs = ds.map((x) => Number(x.conf || 0));
        const max = confs.length ? Math.max(...confs) : null;
        const avg = confs.length ? confs.reduce((a, b) => a + b, 0) / confs.length : null;
        return { count: ds.length, max, avg };
      }
      function renderStats(result) {
        const s = statFromResult(result || {});
        document.getElementById("statModel").textContent = result.model_name || "-";
        document.getElementById("statLatency").textContent = result.latency_ms ?? "-";
        document.getElementById("statCount").textContent = String(s.count);
        document.getElementById("statMaxConf").textContent = s.max == null ? "-" : s.max.toFixed(4);
        document.getElementById("statAvgConf").textContent = s.avg == null ? "-" : s.avg.toFixed(4);
        const ul = document.getElementById("detList");
        ul.innerHTML = "";
        (result.detections || []).forEach((d, i) => {
          const li = document.createElement("li");
          li.textContent = `#${i + 1} ${d.class_name || d.cls} conf=${d.conf} box=${JSON.stringify(d.xyxy)}`;
          ul.appendChild(li);
        });
        if ((result.detections || []).length === 0) {
          const li = document.createElement("li");
          li.textContent = "未检测到目标";
          ul.appendChild(li);
        }
      }

      async function runDetect() {
        if (!state.selectedFile) {
          setRaw({ error: "请先加载并选择图片" });
          return;
        }
        const fd = new FormData();
        fd.append("image", state.selectedFile);
        if (state.currentModel) fd.append("model_name", state.currentModel);
        const conf = confValue();
        if (conf != null) fd.append("conf", String(conf));
        const res = await fetch("/api/v1/infer/upload", { method: "POST", body: fd });
        let data = {};
        try { data = await res.json(); } catch {}
        setRaw(data);
        if (!res.ok) return;
        state.lastResult = data;
        renderStats(data);
        const img = document.getElementById("previewImage");
        if (img && img.src) drawOverlay(data.detections || [], img);
      }

      async function runCompare() {
        if (!state.selectedFile) {
          setRaw({ error: "请先加载并选择图片" });
          return;
        }
        const fd = new FormData();
        fd.append("image", state.selectedFile);
        const conf = confValue();
        if (conf != null) fd.append("conf", String(conf));
        const res = await fetch("/api/v1/infer/compare", { method: "POST", body: fd });
        let data = {};
        try { data = await res.json(); } catch {}
        setRaw(data);
        if (!res.ok) return;
        state.compareResults = data.results || [];
        const grid = document.getElementById("compareGrid");
        grid.innerHTML = "";
        state.compareResults.forEach((r) => {
          const div = document.createElement("div");
          div.className = "compare-item";
          if (r.error) {
            div.textContent = `${r.model_name}: ${r.error}`;
          } else {
            div.textContent = `${r.model_name} | det=${(r.detections || []).length} | latency=${r.latency_ms}ms`;
          }
          grid.appendChild(div);
        });
      }

      function buildSampleMeta() {
        return {
          sample_name: document.getElementById("metaSampleName").value.trim(),
          batch_no: document.getElementById("metaBatchNo").value.trim(),
          station: document.getElementById("metaStation").value.trim(),
          sample_path: document.getElementById("metaImagePath").value.trim(),
          image_size: document.getElementById("metaImageSize").value.trim(),
          source: document.getElementById("metaSource").value.trim(),
        };
      }

      async function saveSampleMetaOnly() {
          setRaw({ info: "样本信息仅在保存复核记录时落库。请先完成一次检测后点击“保存复核”" });
      }

      async function saveDiagnosisRecord() {
        if (!state.lastResult) {
          setRaw({ error: "请先执行检测，再保存复核记录" });
          return;
        }
        const doctorNote = {
          doctor_name: document.getElementById("doctorName").value.trim(),
          risk_level: document.getElementById("riskLevel").value,
          diagnosis: document.getElementById("doctorDiagnosis").value.trim(),
        };
        const payload = {
          sample_meta: buildSampleMeta(),
          infer_result: state.lastResult,
          doctor_note: doctorNote,
        };
        const r = await apiJson("/api/v1/records/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        setRaw(r.data);
        if (r.ok) {
          document.getElementById("saveStatus").textContent = `记录已保存: ${r.data.record_uuid}`;
          await loadRecordList();
        }
      }

      async function loadRecordList() {
        const r = await apiJson("/api/v1/records/list?limit=50");
        if (!r.ok) {
          setRaw(r.data);
          return;
        }
        const sel = document.getElementById("recordSelect");
        sel.innerHTML = "";
        (r.data.records || []).forEach((x) => {
          const op = document.createElement("option");
          op.value = x.record_uuid;
          op.textContent = `${x.created_at} | ${x.model_name} | det=${x.detections_count} | ${x.record_uuid}`;
          sel.appendChild(op);
        });
      }

      function exportSelectedReport() {
        const id = document.getElementById("recordSelect").value;
        if (!id) {
          setRaw({ error: "请先选择记录" });
          return;
        }
        window.open(`/api/v1/report/export?record_uuid=${encodeURIComponent(id)}`, "_blank");
      }

      window.addEventListener("DOMContentLoaded", async () => {
        document.getElementById("singleFileInput").addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          state.files = [file];
          state.selectedFile = file;
          renderFileList();
          updatePreview(file);
          fillMetaFromFile(file);
        });
        await refreshHealthAndModels();
        await loadRecordList();
      });
    </script>
  </body>
</html>
