# Lightweight student model with EPFA-Lite on P3/P4/P5.

nc: 1
scales:
  n: [0.25, 0.20, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 1, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 1, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [1024]]

  - [15, 1, EPFALite, [0, 3, 3, 0.5]]
  - [18, 1, EPFALite, [0, 3, 3, 0.5]]
  - [21, 1, EPFALite, [0, 3, 3, 0.5]]
  - [[22, 23, 24], 1, Detect, [nc]]
